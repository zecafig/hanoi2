name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  issues:
    types: [opened, reopened, edited, labeled]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Ruff
        run: python -m ruff check .

      - name: Pytest with coverage
        run: |
          python -m pytest --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=100

      - name: Upload coverage to Codecov
        if: ${{ github.event_name != 'issues' && secrets.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          flags: unittests
          name: github-actions
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
