[project]
name = "hanoi2"
version = "0.1.0"
description = "Tower of Hanoi game built with pygame-ce"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pygame-ce>=2.5.2",
]

[project.scripts]
hanoi2 = "hanoi.app:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.11.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["hanoi.core"]

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"
